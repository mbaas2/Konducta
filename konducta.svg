<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&amp;display=swap');
    </style>
  </defs>
  
  <!-- K shape monogram -->
  <g>
    <!-- Monogram background -->
    <rect x="8" y="8" width="52" height="52" rx="14" fill="url(#grad1)" stroke="#3a8ef6" stroke-width="1.5"/>
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
      </linearGradient>
      <radialGradient id="glow1">
        <stop offset="0%" style="stop-color:#3a8ef6;stop-opacity:0.15" />
        <stop offset="100%" style="stop-color:#3a8ef6;stop-opacity:0" />
      </radialGradient>
    </defs>
    <ellipse cx="30" cy="30" rx="26" ry="26" fill="url(#glow1)"/>
    
    <!-- K lines -->
    <line x1="18" y1="13" x2="18" y2="47" stroke="#3a8ef6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="30" x2="38" y2="16" stroke="#3a8ef6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="30" x2="38" y2="44" stroke="#3a8ef6" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text: Konducta -->
  <text x="68" y="38" font-family="Syne, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.03em" fill="#f0ede8">Konducta</text>
  
  <!-- Text: Event Orchestration -->
  <text x="68" y="60" font-family="Syne, sans-serif" font-size="9" font-weight="500" letter-spacing="0.22em" fill="#3a8ef6">EVENT ORCHESTRATION</text>
</svg>